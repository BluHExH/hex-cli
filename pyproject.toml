[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-cli"
version = "2.2.0"
description = "HEX CLI — native terminal AI coding agent (Python + Textual)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NeonBuild"}]
keywords = ["ai", "coding-agent", "cli", "terminal", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pygments>=2.17.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "textual>=0.80.0",
]

[project.scripts]
hex = "hex_cli.main:main"

[project.urls]
Homepage = "https://github.com/BluHExH/hex-cli"
Repository = "https://github.com/BluHExH/hex-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["hex_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
